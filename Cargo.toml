[package]
name = "nex-board"
version = "0.3.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.2", features = [ "bevy_ui", "bevy_ui_render", "bevy_window" ] }
bevy_common_assets = { version = "0.14.0", features = ["csv"] }
csv = "1.4.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = "1.48.0"
toml = "0.9.8"

# ネイティブ専用（WebSocket サーバー）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.6", features = ["ws"] }
bevy-tokio-tasks = "0.17.0"
futures-util = "0.3"

# wasm32（ブラウザ）専用
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.17.2", features = ["webgl2"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
tokio = { version = "1.48.0", features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "MessageEvent",
  "UrlSearchParams",
  "EventTarget",
  "Navigator",
  "StorageManager",
  "FileSystemHandle",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "File",
  "Blob",
  "console",
] }

# wasm 配布用（サイズ優先）。既存の release プロファイルには影響しない
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
